services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      CHAT_MODEL: ${CHAT_MODEL:-llama3.1:8b}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      OLLAMA_BASE_URL: http://ollama:11434
      PERSIST_DIR: /app/data/chroma_db
      RAG_LOG_FILE: /app/data/rag.log
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
  ollama-data:
